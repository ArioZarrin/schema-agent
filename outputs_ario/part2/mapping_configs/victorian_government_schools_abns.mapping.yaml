unmapped_fields:
- source_field: SchoolNumber
  reason: 'Checked: used verbatim for observation.source_record_id above, not discarded.
    Listed here to explicitly account for the source column in the validator''s entity-field
    accounting; no ontology entity field represents a school number, and it must not
    be treated as an ABN, ACN or NZBN.'
- source_field: SchoolName
  reason: 'Checked: all accessible names are nonblank and distinct, but a school label
    does not establish the registered legal name or trading name of the ABN holder.
    Retain in raw provenance without mapping to either entity name field.'
- source_field: Fin_Period
  reason: 'Checked: all accessible rows contain 201506. This financial-period code
    does not establish entity registration, observation time or exact claim validity
    boundaries. Do not invent dates.'
- source_field: LoadDate
  reason: 'Checked: all 1232 accessible values parse as timestamps, spanning 2015-07-02
    to 2015-07-31. A source-system load time is not proven to be the publisher''s
    assertion time, ingestion time in Firmable, registration date or claim-validity
    boundary. Retain raw; do not assign unsupported timestamp semantics.'
research_notes: []
agent_notes:
- All five source fields were reviewed using the supplied profiles and read-only queries
  over the 1232 accessible rows; held-out rows were not queried.
- Preserve runtime ingestion-time and extractor-version provenance. The current observed_at
  fallback to ingestion time is not evidence of when this historical source stated
  its claims; metadata_modified in 2025 also does not establish freshness of 2015
  records. Keep this temporal limitation explicit.
- No ACN is derived from an ABN suffix; no entity type, active status, location or
  industry is inferred from the school dataset title.
- SchoolNumber is intentionally included in unmapped_fields solely to resolve the
  reported accounting error while retaining its existing provenance mapping.
