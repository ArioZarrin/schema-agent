- source_fields:
  - State
  target_field: address.state
  transformation:
    type: sql_expression
    expression: CASE WHEN nullif(trim("State"), '') IS NULL THEN NULL WHEN upper(trim("State"))
      IN ('NSW', 'NEW SOUTH WALES') THEN 'NSW' WHEN upper(trim("State")) IN ('VIC',
      'VICTORIA') THEN 'VIC' WHEN upper(trim("State")) IN ('QLD', 'QUEENSLAND') THEN
      'QLD' WHEN upper(trim("State")) IN ('WA', 'WESTERN AUSTRALIA') THEN 'WA' WHEN
      upper(trim("State")) IN ('SA', 'SOUTH AUSTRALIA') THEN 'SA' WHEN upper(trim("State"))
      IN ('TAS', 'TASMANIA') THEN 'TAS' WHEN upper(trim("State")) IN ('ACT', 'AUSTRALIAN
      CAPITAL TERRITORY') THEN 'ACT' WHEN upper(trim("State")) IN ('NT', 'NORTHERN
      TERRITORY') THEN 'NT' ELSE 'OTHER' END
    value: null
  confidence: 0.91
  derivation_level: L1
  reason: Normalizes recognized Australian state and territory names or abbreviations
    to the ontology enum; other nonblank values map to OTHER.
