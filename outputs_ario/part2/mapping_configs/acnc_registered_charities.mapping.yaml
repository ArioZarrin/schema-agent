  target_field: address.full
  transformation:
    type: sql_expression
    expression: concat_ws(', ', nullif(trim("Address_Line_1"), ''), nullif(trim("Address_Line_2"),
      ''), nullif(trim("Address_Line_3"), ''), nullif(trim("Town_City"), ''), nullif(trim(concat_ws('
      ', nullif(trim("State"), ''), nullif(trim("Postcode"), ''))), ''), nullif(trim("Country"),
      ''))
    value: null
  confidence: 0.94
  derivation_level: L1
  reason: Combines the supplied address components in order, omitting null and blank
    components.
