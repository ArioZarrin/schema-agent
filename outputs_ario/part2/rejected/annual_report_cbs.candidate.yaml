agent_notes:
- Retry investigation used SELECT * FROM source_data and confirmed the accessible
  rows are a reporting-year header, four aggregate statistical categories and a methodology
  footnote. The held-out validation row was not exposed by this query.
- No legal names, trading names, ABNs, ACNs, NZBNs, individual statuses, registration
  dates or addresses are supplied. Do not manufacture entity records or assign entity_type=incorporated_association
  to aggregate rows.
- Keep the selected CSV reader (cp1252, comma delimiter, header=true, skip=1); metadata's
  XLSX label is inconsistent with the selected CSV resource and does not justify changing
  the reader.
- Retain runtime-provided observation.ingested_at and observation.extractor_version.
  For runtime observation.observed_at, the supplied resource_last_modified timestamp
  2018-10-17T23:34:16.095242 is a resource-level timestamp proxy, not an individual
  claim date. Do not interpret the 2025 catalog metadata modification as when these
  historical statistics became true or conflate ingestion time with source observation
  time.
- This is a provenance-only mapping. Aggregate counts require a separate statistical
  schema; the present Firmable entity ontology cannot represent them. Header and footnote
  records must not be treated as entity observations.
