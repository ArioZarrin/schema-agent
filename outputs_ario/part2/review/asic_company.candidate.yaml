runtime_fields:
  observation.observed_at: resource_timestamp_or_ingestion_time
  observation.ingested_at: ingestion_time
  observation.extractor_version: extractor_version
unmapped_fields:
- source_field: Type
  reason: ASIC company-type codes are not sufficiently established here to map safely
    to the ontology's entity-type categories.
- source_field: Class
  reason: ASIC-specific classification code with no direct ontology target.
- source_field: Sub Class
  reason: ASIC-specific subclass code with no direct ontology target.
- source_field: Previous State of Registration
  reason: This is a previous registration jurisdiction, not an entity address state.
- source_field: State Registration number
  reason: ASIC state registration number is not one of the supported identifier types.
- source_field: Modified since last report
  reason: Dataset change indicator rather than an entity attribute.
- source_field: Current Name Indicator
  reason: Source-specific indicator used to identify current-name records; it has
    no direct ontology target.
- source_field: Current Name Start Date
  reason: This is the effective date of a name change, not the entity's date of registration
    or another supported date field.
research_notes: []
agent_notes:
- ABNs are emitted only when they pass the standard ABN checksum; invalid values,
  including placeholders, become NULL.
- The source record identifier is a deterministic hash of all 15 source columns because
  ACN is not unique across name-history records.
