    the source record to be traced.
- source_fields:
  - ABR.ABN.@status
  target_field: entity.status
  transformation:
    type: sql_expression
    expression: CASE WHEN "ABR.ABN.@status" = 'ACT' THEN 'active' WHEN "ABR.ABN.@status"
      = 'CAN' THEN 'deregistered' ELSE 'unknown' END
    value: null
  confidence: 0.98
  derivation_level: L1
  reason: Converts ABR status codes ACT and CAN to ontology statuses; unrecognized
    values remain unknown.
- source_fields:
  - ABR.EntityType.EntityTypeInd
  target_field: entity.entity_type
  transformation:
    type: sql_expression
    expression: CASE WHEN "ABR.EntityType.EntityTypeInd" = 'IND' THEN 'sole_trader'
      WHEN "ABR.EntityType.EntityTypeInd" IN ('DIT', 'SMF') THEN 'trust' WHEN "ABR.EntityType.EntityTypeInd"
      = 'FPT' THEN 'partnership' WHEN "ABR.EntityType.EntityTypeInd" = 'PRV' THEN
      'company' ELSE 'unknown' END
    value: null
  confidence: 0.91
  derivation_level: L1
  reason: Maps familiar ABR entity type codes to ontology categories and defaults
    other codes to unknown rather than guessing.
- source_fields:
  - ABR.ABN.@ABNStatusFromDate
  target_field: observation.valid_from
  transformation:
    type: sql_expression
    expression: TRY_STRPTIME("ABR.ABN.@ABNStatusFromDate", '%Y%m%d')::DATE
    value: null
  confidence: 0.96
  derivation_level: L1
  reason: The source labels this as the date from which the ABN status applies; parses
    its YYYYMMDD representation.
- source_fields:
  - ABR.LegalEntity.BusinessAddress.AddressDetails.State
  - ABR.MainEntity.BusinessAddress.AddressDetails.State
  target_field: address.state
  transformation:
    type: sql_expression
    expression: CASE WHEN COALESCE("ABR.LegalEntity.BusinessAddress.AddressDetails.State",
      "ABR.MainEntity.BusinessAddress.AddressDetails.State") IN ('NSW', 'VIC', 'QLD',
      'WA', 'SA', 'TAS', 'ACT', 'NT') THEN COALESCE("ABR.LegalEntity.BusinessAddress.AddressDetails.State",
      "ABR.MainEntity.BusinessAddress.AddressDetails.State") WHEN COALESCE("ABR.LegalEntity.BusinessAddress.AddressDetails.State",
      "ABR.MainEntity.BusinessAddress.AddressDetails.State") IS NOT NULL THEN 'OTHER'
      ELSE NULL END
    value: null
  confidence: 0.96
  derivation_level: L1
  reason: Uses the populated legal-entity or main-entity business address state and
    normalizes values to the ontology enum.
- source_fields:
  - ABR.LegalEntity.BusinessAddress.AddressDetails.Postcode
  - ABR.MainEntity.BusinessAddress.AddressDetails.Postcode
  target_field: address.postcode
  transformation:
    type: sql_expression
    expression: COALESCE("ABR.LegalEntity.BusinessAddress.AddressDetails.Postcode",
