[project]
name = "firmable"
version = "0.1.0"
description = "Universal data cleaning and entity resolution tool for tabular datasets."
readme = "README.md"
authors = [
    { name = "Ario Zarrinkolah", email = "ario.zarrin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.19",
    "duckdb>=1.5.6",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith>=0.14.1",
    "litellm>=1.103.0",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "openai>=2.54.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "ruff>=0.16.9",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "tavily-python>=0.8.4",
    "xlrd>=2.0.2",
]

[project.scripts]
firmable = "firmable:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
]
